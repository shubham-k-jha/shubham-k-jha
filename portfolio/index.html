<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shubham Jha — Portfolio Explorer</title><style>:root{--bg:#07111f;--s:#0d1b2a;--s2:#11243a;--t:#edf5ff;--m:#9fb1c6;--l:#223953;--a:#38bdf8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#132a46 0,#07111f 45%);color:var(--t);font:16px/1.6 system-ui}main{max-width:1180px;margin:auto;padding:28px 20px 70px}.hero{padding:45px 0 25px}.ey{color:#67e8f9;font-weight:800;letter-spacing:.12em;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,78px);line-height:1;margin:10px 0}.hero p{max-width:700px;color:var(--m);font-size:18px}.hero a{color:#67e8f9;margin-right:15px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.controls button,.controls input{background:var(--s);border:1px solid var(--l);color:var(--t);padding:11px 14px;border-radius:12px}.controls button{cursor:pointer}.controls button.active{border-color:var(--a);box-shadow:0 0 0 2px #38bdf833}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px}.card{background:linear-gradient(145deg,var(--s),var(--s2));border:1px solid var(--l);border-radius:18px;padding:20px;transition:.18s}.card:hover{transform:translateY(-3px);border-color:#4b78a5}.card h3{margin:0 0 7px}.tag{display:inline-block;padding:4px 8px;border-radius:999px;background:#18324e;color:#9edcff;font-size:12px;margin:3px}.card a{color:#67e8f9;text-decoration:none;font-weight:700}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat{padding:18px;background:#0b1929;border:1px solid var(--l);border-radius:14px}.stat b{font-size:28px;display:block}@media(max-width:700px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><main><section class="hero"><div class="ey">Portfolio Explorer</div><h1>Shubham Jha</h1><p>Research → Data Analytics → Data Science. Filter projects by capability instead of scrolling through a repository dump.</p><a href="https://github.com/shubham-k-jha">GitHub</a><a href="https://shubham-k-jha.github.io/">Main Website</a><a href="https://www.linkedin.com/in/shubham-k-jha/">LinkedIn</a></section><div class="stats" id="stats"></div><div class="controls" id="filters"></div><div class="grid" id="grid"></div></main><script>const L={data_analytics:'📊 Data Analytics',data_science:'🤖 Data Science & ML',sql:'🗄️ SQL & Databases',bi:'📈 BI & Visualization',python:'🐍 Python & Automation',research:'🔬 Research',cloud:'☁️ Cloud',learning:'📚 Learning'};let d=[],s={c:'all',q:''};async function load(){d=(await fetch('projects.json').then(r=>r.json())).projects;render()}function render(){let cs=['all',...Object.keys(L)];filters.innerHTML=cs.map(c=>`<button class="${s.c===c?'active':''}" onclick="s.c='${c}';render()">${c==='all'?'All':L[c]}</button>`).join('')+`<input placeholder="Search projects…" value="${s.q}" oninput="s.q=this.value;render()">`;let x=d.filter(p=>(s.c==='all'||p.categories.includes(s.c))&&(!s.q||(p.name+' '+p.description+' '+p.categories).toLowerCase().includes(s.q.toLowerCase())));stats.innerHTML=`<div class="stat"><b>${d.length}</b>Projects</div><div class="stat"><b>${new Set(d.flatMap(p=>p.categories)).size}</b>Tracks</div><div class="stat"><b>Python</b>Core</div><div class="stat"><b>SQL</b>Core</div>`;grid.innerHTML=x.map(p=>`<article class="card"><h3>${p.name}</h3><p>${p.description}</p><div>${p.categories.map(c=>`<span class="tag">${L[c]}</span>`).join('')}</div><p><a href="${p.repo}">View repository →</a></p></article>`).join('')||'<p>No project matches.</p>'}load()</script></body></html>
