<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">Analysis of the UCI Online Retail II dataset using Pandas and</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">PySpark, including RFM customer segmentation and cancellation</text><text x="28" y="144" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">prediction with Random Forest.</text><g><rect x="28" y="168" width="58" height="22" rx="11" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="57" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Python</text></g><g><rect x="94.2" y="168" width="58" height="22" rx="11" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="123" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Pandas</text></g><g><rect x="160.4" y="168" width="65" height="22" rx="11" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="193" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">PySpark</text></g><g><rect x="233.3" y="168" width="105" height="22" rx="11" fill="#22c55e" fill-opacity="0.12" stroke="#22c55e" stroke-opacity="0.5"/><text x="286" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Random Forest</text></g>
