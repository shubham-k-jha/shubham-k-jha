<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">A fully interactive chess game built with vanilla HTML, CSS</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">and JavaScript.</text><g><rect x="28" y="148" width="98" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.5"/><text x="77" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Browser Game</text></g><g><rect x="134.4" y="148" width="52" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.5"/><text x="160" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Chess</text></g><g><rect x="193.9" y="148" width="31" height="22" rx="11" fill="#8b5cf6" fill-opacity="0.12" stroke="#8b5cf6" stroke-opacity="0.5"/><text x="210" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">AI</text></g>
<text x="28" y="216" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#8b5cf6" letter-spacing="2">PLAY LIVE<tspan dx="8">&#8594;<animate attributeName="dx" values="8;16;8" dur="1.6s" repeatCount="indefinite"/></tspan></text></g>
