<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">Business analytics project combining SQL + Python + Power BI</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">to analyze transactional data and produce business insights</text><text x="28" y="144" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">and dashboards.</text><g><rect x="28" y="168" width="38" height="22" rx="11" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.5"/><text x="47" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">SQL</text></g><g><rect x="74.1" y="168" width="58" height="22" rx="11" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.5"/><text x="103" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Python</text></g><g><rect x="140.3" y="168" width="72" height="22" rx="11" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.5"/><text x="176" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Power BI</text></g><g><rect x="219.9" y="168" width="58" height="22" rx="11" fill="#fb923c" fill-opacity="0.12" stroke="#fb923c" stroke-opacity="0.5"/><text x="249" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Pandas</text></g>
