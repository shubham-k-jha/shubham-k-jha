<g clip-path="url(#c)"><rect width="490" height="238" fill="#070b1a"/>
<circle cx="466" cy="18" r="80" fill="#ff2d95" opacity="0.14"><animate attributeName="r" values="65;95;65" dur="5s" repeatCount="indefinite"/></circle>
<text x="28" y="40" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" letter-spacing="3" fill="#ff2d95" font-weight="700">GAME 01</text>
<text x="28" y="76" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="800" fill="#f1f5ff">Neon Pong</text>
<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">A simple Pong game with mouse/keyboard controls and an AI</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">opponent.</text><g><rect x="28" y="148" width="98" height="22" rx="11" fill="#ff2d95" fill-opacity="0.12" stroke="#ff2d95" stroke-opacity="0.5"/><text x="77" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Browser Game</text></g><g><rect x="134.4" y="148" width="85" height="22" rx="11" fill="#ff2d95" fill-opacity="0.12" stroke="#ff2d95" stroke-opacity="0.5"/><text x="177" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">JavaScript</text></g><g><rect x="227.4" y="148" width="31" height="22" rx="11" fill="#ff2d95" fill-opacity="0.12" stroke="#ff2d95" stroke-opacity="0.5"/><text x="243" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">UI</text></g>
<text x="28" y="216" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="13" font-weight="700" fill="#ff2d95" letter-spacing="2">PLAY LIVE<tspan dx="8">&#8594;<animate attributeName="dx" values="8;16;8" dur="1.6s" repeatCount="indefinite"/></tspan></text></g>
<rect x="1" y="1" width="488" height="236" rx="14" fill="none" stroke="#ff2d95" stroke-opacity="0.3" stroke-width="1.5"/>
<rect x="1" y="1" width="488" height="236" rx="14" fill="none" stroke="#ff2d95" stroke-width="3" stroke-linecap="round" pathLength="1000" stroke-dasharray="80 920"><animate attributeName="stroke-dashoffset" values="0;-1000" dur="7s" repeatCount="indefinite"/></rect></svg>