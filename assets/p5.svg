<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">End-to-end Netflix Top 10 analytics covering global and country intelligence, content lifecycle, statistical analysis, forecasting and</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">machine learning using official Netflix published data.</text><g><rect x="28" y="148" width="58" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/><text x="57" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Python</text></g><g><rect x="94.2" y="148" width="38" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/><text x="113" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">SQL</text></g><g><rect x="140.3" y="148" width="85" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/><text x="183" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Statistics</text></g><g><rect x="233.3" y="148" width="125" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/><text x="296" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Machine Learning</text></g><g><rect x="366.5" y="148" width="78" height="22" rx="11" fill="#ef4444" fill-opacity="0.12" stroke="#ef4444" stroke-opacity="0.5"/><text x="406" y="163" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Streamlit</text></g>
