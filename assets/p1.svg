<text x="28" y="104" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">Physics-informed machine learning for solar active regions,</text><text x="28" y="124" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">magnetic-flux emergence and flare productivity using Kutsenko</text><text x="28" y="144" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="13.5" fill="#a9b6d8">catalogues, XGBoost, SHAP and statistical modelling.</text><g><rect x="28" y="168" width="58" height="22" rx="11" fill="#7c8bff" fill-opacity="0.12" stroke="#7c8bff" stroke-opacity="0.5"/><text x="57" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Python</text></g><g><rect x="94.2" y="168" width="125" height="22" rx="11" fill="#7c8bff" fill-opacity="0.12" stroke="#7c8bff" stroke-opacity="0.5"/><text x="157" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Machine Learning</text></g><g><rect x="227.39999999999998" y="168" width="65" height="22" rx="11" fill="#7c8bff" fill-opacity="0.12" stroke="#7c8bff" stroke-opacity="0.5"/><text x="260" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">XGBoost</text></g><g><rect x="300.29999999999995" y="168" width="45" height="22" rx="11" fill="#7c8bff" fill-opacity="0.12" stroke="#7c8bff" stroke-opacity="0.5"/><text x="323" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">SHAP</text></g><g><rect x="353.09999999999997" y="168" width="85" height="22" rx="11" fill="#7c8bff" fill-opacity="0.12" stroke="#7c8bff" stroke-opacity="0.5"/><text x="396" y="183" text-anchor="middle" font-family="'SFMono-Regular',Consolas,'Courier New',monospace" font-size="11" fill="#dbe7ff">Statistics</text></g>
