name: Update Profile README

on:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check profile files
        run: |
          test -f README.md
          test -f config.yaml
          echo "Profile README is ready."
      - name: Commit changes if generated content changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git diff --exit-code || {
            git add README.md data/repositories.json
            git commit -m "chore: update profile portfolio"
            git push
          }
